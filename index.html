<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
        aside { width: 380px; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
        h1 { font-size: 17px; margin: 0; padding: 12px; border-bottom: 1px solid #ddd; }
        #log { flex: 1; overflow-y: auto; padding: 10px; }
        .msg { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
        .user { background: #e8f0fe; margin-left: 40px; }
        .bot { background: #f3f3f3; margin-right: 20px; }
        .steps { font-size: 12px; color: #555; margin: 0 0 6px; }
        .steps span { display: inline-block; background: #fff3cd; border-radius: 10px; padding: 1px 8px; margin: 0 4px 4px 0; }
        .steps span.fail { background: #f8d7da; }
        #chips { padding: 0 10px 6px; display: flex; flex-wrap: wrap; gap: 6px; }
        #chips button { font-size: 12px; border: 1px solid #ccc; background: #fff; border-radius: 12px; padding: 3px 10px; cursor: pointer; }
        form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; font: inherit; padding: 6px 8px; }
        button.send { font: inherit; padding: 6px 12px; }
        #map { flex: 1; }
        #mapNote { position: absolute; z-index: 1000; right: 10px; top: 10px; background: #fffd; padding: 4px 10px; border-radius: 6px; font-size: 13px; }
        @media (max-width: 800px) { body { flex-direction: column-reverse; } aside { width: auto; height: 60%; border-right: 0; border-top: 1px solid #ccc; } }
    </style>
</head>
<body>
    <aside>
        <h1>🏝️ 제주 여행 추천 에이전트</h1>
        <div id="log"></div>
        <div id="chips"></div>
        <form id="form">
            <input id="input" placeholder="예: 내일 서쪽에서 갈 만한 곳 추천해줘" maxlength="500" autocomplete="off">
            <button class="send">보내기</button>
        </form>
    </aside>
    <div id="map"></div>
    <div id="mapNote" hidden></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap contributors · 날씨: Open-Meteo"
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const logEl = document.getElementById("log")
        const form = document.getElementById("form")
        const input = document.getElementById("input")
        const noteEl = document.getElementById("mapNote")
        const chatHistory = []   // 서버로 보내는 이전 대화(텍스트만)
        let mapRun = 0

        const add = (cls, text) => {
            const div = document.createElement("div")
            div.className = "msg " + cls
            div.textContent = text
            logEl.appendChild(div)
            logEl.scrollTop = logEl.scrollHeight
            return div
        }

        const stepsEl = (steps) => {
            const box = document.createElement("div")
            box.className = "steps"
            const label = ["에이전트가 부른 도구: "]
            box.append(...label)
            for (const s of steps) {
                const tag = document.createElement("span")
                if (!s.ok) tag.className = "fail"
                const args = Object.entries(s.input || {}).map(([k, v]) => `${k}=${v}`).join(", ")
                tag.textContent = `${s.name}(${args})`
                box.appendChild(tag)
            }
            return box
        }

        // 좌표가 없는 목록이라 이름으로 위치를 찾고(Nominatim, 제주 범위 안), 결과는 브라우저에 저장해 둔다.
        const geocode = async (name) => {
            const key = "jeju-geo:" + name
            try {
                const saved = localStorage.getItem(key)
                if (saved !== null) return { pos: JSON.parse(saved), cached: true }
            } catch (e) {}
            const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr" +
                "&viewbox=126.1,33.6,127.0,33.1&bounded=1&q=" + encodeURIComponent("제주 " + name)
            const res = await (await fetch(url)).json()
            const pos = res.length ? [Number(res[0].lat), Number(res[0].lon)] : null
            try { localStorage.setItem(key, JSON.stringify(pos)) } catch (e) {}
            return { pos, cached: false }
        }
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

        // 에이전트가 답에서 언급한 장소만 지도에 찍는다.
        const showOnMap = async (spots, reply) => {
            const id = ++mapRun
            layer.clearLayers()
            const picked = spots.filter((s) => reply.includes(s.name))
            if (!picked.length) { noteEl.hidden = true; return }
            const bounds = []
            noteEl.hidden = false
            for (const spot of picked) {
                noteEl.textContent = `지도에 표시 중… (${bounds.length}/${picked.length})`
                let result = { pos: null }
                try { result = await geocode(spot.name) } catch (e) {}
                if (id !== mapRun) return
                if (result.pos) {
                    const popup = document.createElement("div")
                    popup.textContent = `${spot.name} (${spot.indoor ? "실내" : "야외"} · ${spot.description})`
                    L.marker(result.pos).addTo(layer).bindPopup(popup)
                    bounds.push(result.pos)
                    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 })
                }
                if (!result.cached) await sleep(1100)   // Nominatim 은 초당 1회까지만 허용
            }
            noteEl.textContent = `추천 장소 ${bounds.length}곳 표시` +
                (bounds.length < picked.length ? ` (${picked.length - bounds.length}곳은 위치를 찾지 못함)` : "")
        }

        const ask = async (message) => {
            add("user", message)
            const wait = add("bot", "도구를 골라 알아보는 중…")
            input.disabled = true
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ message, history: chatHistory })
                })
                const data = await res.json()
                wait.remove()
                if (data.steps && data.steps.length) logEl.appendChild(stepsEl(data.steps))
                if (!res.ok) { add("bot", "오류: " + (data.error || res.status)); return }
                add("bot", data.reply)
                chatHistory.push({ role: "user", content: message }, { role: "assistant", content: data.reply })
                showOnMap(data.spots || [], data.reply)
            } catch (e) {
                wait.remove()
                add("bot", "서버에 연결하지 못했습니다.")
            } finally {
                input.disabled = false
                input.focus()
            }
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault()
            const message = input.value.trim()
            if (!message) return
            input.value = ""
            ask(message)
        })

        for (const q of ["오늘 제주시에서 뭐 하면 좋을까?", "내일 서쪽에서 갈 만한 곳 추천해줘", "비 오면 서귀포에서 어디 가지?"]) {
            const b = document.createElement("button")
            b.textContent = q
            b.onclick = () => ask(q)
            document.getElementById("chips").appendChild(b)
        }
        add("bot", "날씨와 관광지 목록을 직접 찾아보고 추천해 드려요. 어디서 무엇을 하고 싶은지 편하게 말해 주세요.")
    </script>
</body>
</html>
