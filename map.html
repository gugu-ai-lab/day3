<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        form { display: flex; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid #ccc; flex-wrap: wrap; }
        main { flex: 1; display: flex; min-height: 0; }
        #map { flex: 1; }
        #list { width: 280px; margin: 0; padding: 0; overflow-y: auto; list-style: none; border-left: 1px solid #ccc; }
        #list li { padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; }
        #list li small { color: #666; display: block; }
        #list li.missing { color: #999; cursor: default; }
        #status { margin-left: auto; font-size: 13px; color: #555; }
        @media (max-width: 700px) { main { flex-direction: column; } #list { width: auto; height: 35%; border-left: 0; border-top: 1px solid #ccc; } }
    </style>
</head>
<body>
    <form id="form">
        <label>지역
            <select id="area">
                <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
            </select>
        </label>
        <label>실내 여부
            <select id="indoor">
                <option value="">전체</option><option value="true">실내</option><option value="false">야외</option>
            </select>
        </label>
        <button>지도에 표시</button>
        <span id="status">준비 중…</span>
    </form>
    <main>
        <div id="map"></div>
        <ul id="list"></ul>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const form = document.getElementById("form")
        const statusEl = document.getElementById("status")
        const listEl = document.getElementById("list")
        let find_spots
        let runId = 0

        // api/tools.js 는 Node 용(require/module)이라, 브라우저에서는 같은 파일을 그대로 불러 쓰도록 둘을 흉내 낸다.
        const loadTools = async () => {
            const data = await (await fetch("jeju_spots.json")).json()
            window.module = { exports: {} }
            window.require = () => data
            await new Promise((resolve, reject) => {
                const s = document.createElement("script")
                s.src = "api/tools.js"
                s.onload = resolve
                s.onerror = reject
                document.head.appendChild(s)
            })
            find_spots = module.exports.find_spots
        }

        // 좌표가 없는 목록이라 이름으로 위치를 찾고(Nominatim, 제주 범위 안), 결과는 브라우저에 저장해 둔다.
        const geocode = async (name) => {
            const key = "jeju-geo:" + name
            try {
                const saved = localStorage.getItem(key)
                if (saved) return JSON.parse(saved)
            } catch (e) {}
            const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr" +
                "&viewbox=126.1,33.6,127.0,33.1&bounded=1&q=" + encodeURIComponent("제주 " + name)
            const res = await (await fetch(url)).json()
            const pos = res.length ? [Number(res[0].lat), Number(res[0].lon)] : null
            try { localStorage.setItem(key, JSON.stringify(pos)) } catch (e) {}
            return pos
        }

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

        const show = async (area, indoor) => {
            const id = ++runId
            layer.clearLayers()
            listEl.replaceChildren()
            const result = find_spots({ area, indoor })
            if (result.error) { statusEl.textContent = result.error; return }
            if (!result.spots.length) { statusEl.textContent = "조건에 맞는 장소가 없습니다."; return }

            const bounds = []
            let found = 0
            for (const spot of result.spots) {
                if (id !== runId) return   // 새로 검색하면 이전 검색은 멈춘다
                statusEl.textContent = `위치 찾는 중… (${found}/${result.spots.length})`
                const li = document.createElement("li")
                const detail = document.createElement("small")
                detail.textContent = `${spot.area} · ${spot.indoor ? "실내" : "야외"} · ${spot.description}`
                li.append(spot.name, detail)
                listEl.appendChild(li)

                let pos = null
                try {
                    const cached = localStorage.getItem("jeju-geo:" + spot.name) !== null
                    pos = await geocode(spot.name)
                    if (!cached) await sleep(1100)   // Nominatim 은 초당 1회까지만 허용
                } catch (e) {}
                if (id !== runId) return
                if (!pos) { li.classList.add("missing"); detail.textContent += " · 위치를 찾지 못함"; continue }

                found++
                const popup = document.createElement("div")
                popup.textContent = `${spot.name} (${spot.indoor ? "실내" : "야외"} · ${spot.description})`
                const marker = L.marker(pos).addTo(layer).bindPopup(popup)
                li.onclick = () => { map.setView(pos, 13); marker.openPopup() }
                bounds.push(pos)
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 })
            }
            statusEl.textContent = `${found}곳 표시` +
                (result.total > result.spots.length ? ` (조건에 맞는 ${result.total}곳 중 ${result.spots.length}곳)` : "")
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault()
            const v = document.getElementById("indoor").value
            show(document.getElementById("area").value, v === "" ? undefined : v === "true")
        })

        loadTools().then(
            () => { statusEl.textContent = "지역을 고르고 버튼을 누르세요." },
            () => { statusEl.textContent = "데이터를 불러오지 못했습니다. file:// 이 아니라 웹 서버로 열어야 합니다." }
        )
    </script>
</body>
</html>
